version: '3.8'

services:
  # MySQL 8.x Relational Database
  mysql-db:
    image: mysql:8.0
    container_name: fraudguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fraud_detection_db
      MYSQL_USER: frauduser
      MYSQL_PASSWORD: fraudpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudnet

  # Python Machine Learning Microservice (CatBoost + XGBoost Voting Ensemble)
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: fraudguard-ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - ML_PORT=5001
      - PYTHONUNBUFFERED=1
    networks:
      - fraudnet

  # Java 21 / Spring Boot 3.x Primary Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudguard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=fraud_detection_db
      - DB_USER=frauduser
      - DB_PASSWORD=fraudpassword
      - ML_SERVICE_URL=http://ml-service:5001
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      mysql-db:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - fraudnet

networks:
  fraudnet:
    driver: bridge

volumes:
  mysql_data:
    driver: local
